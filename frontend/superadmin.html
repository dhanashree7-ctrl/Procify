<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procify | Superadmin Analytics</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        .container { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .chart-box { background: #1e293b; height: 300px; border-radius: 1rem; margin-top: 1rem; border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Institution Analytics</h1>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div>
                <h3>Exam Integrity Trends</h3>
                <div class="chart-box">Integrity Chart Placeholder</div>
            </div>
            <div>
                <h3>User Growth</h3>
                <div class="chart-box">Growth Chart Placeholder</div>
            </div>
        </div>
    </div>
</body>
</html>
