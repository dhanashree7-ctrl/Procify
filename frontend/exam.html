<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procify | Secure Exam Environment</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        header {
            padding: 1rem 2rem;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        .question-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .sidebar {
            width: 300px;
            background: var(--surface);
            padding: 1rem;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .sentinel-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .warning {
            color: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 800; font-size: 1.5rem; letter-spacing: -0.025em;">PROCIFY</div>
        <div class="sentinel-badge">Sentinel Active</div>
    </header>
    <div class="main-container">
        <div class="question-area">
            <h1>Mid-Term Assessment</h1>
            <p>Please ensure you do not switch tabs or resize this window. All activity is being audited.</p>
            <!-- Exam Content Goes Here -->
        </div>
        <div class="sidebar">
            <h3>Monitoring Status</h3>
            <p id="timer">Time Remaining: 45:00</p>
            <div id="status-log"></div>
        </div>
    </div>
    <script>
        // Sentinel JS Implementation Placeholder
        console.log("Sentinel initialized...");
        window.addEventListener('blur', () => {
            console.warn("Tab switch detected!");
        });
    </script>
</body>
</html>
