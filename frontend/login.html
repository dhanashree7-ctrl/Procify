<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procify | Login</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0 1.5rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #6366f1;
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-top:0">Student Login</h2>
        <label>USN</label>
        <input type="text" placeholder="e.g. 1MS20IS001">
        <label>Session Code</label>
        <input type="text" placeholder="Enter code shared by professor">
        <button onclick="window.location.href='exam.html'">Join Exam</button>
    </div>
</body>
</html>
