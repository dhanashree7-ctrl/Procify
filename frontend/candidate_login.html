<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procify | Interview Login</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0 1.5rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
        }
        .magic-link-btn {
            background: transparent;
            border: 1px solid #6366f1;
            color: #6366f1;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-top:0">Candidate Login</h2>
        <p style="color: #94a3b8; font-size: 0.875rem">Check your email for the invite link.</p>
        <label>Email Address</label>
        <input type="email" value="candidate@example.com" readonly>
        <button style="width:100%; padding: 0.75rem; background:#6366f1; border:none; border-radius:0.5rem; color:white; font-weight:600;">Start Interview</button>
    </div>
</body>
</html>
